# BraimSec production stack (Hetzner CX22)
#
#   caddy  ->  api (uvicorn)  ->  redis  <-  worker (celery)
#
# api and worker share ONE host directory (HOST_DATA_DIR, mounted at the
# SAME path inside both containers): the worker MUST see the same scan
# targets and the same BRAIMSEC_DB as the API, and the sandbox containers
# the worker spawns mount target dirs by absolute path -- so the host path
# and the worker-visible path must be identical (no translation layer).
#
# Server prep (once):
#   export HOST_DATA_DIR=/data/braimsec   # or set it in .env
#   sudo mkdir -p $HOST_DATA_DIR
#   docker build -f deploy/docker/scan-runner.Dockerfile \
#       -t braimsec/scan-runner:1.0 .
#
# Usage (on the server, inside deploy/):
#   cp .env.example .env   # then fill SITE_ADDRESS (+ secrets when needed)
#   docker compose -f docker-compose.prod.yml up -d --build

name: braimsec

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      BRAIMSEC_BROKER_URL: redis://redis:6379/0
      BRAIMSEC_DB: ${HOST_DATA_DIR:-/data/braimsec}/braimsec.db
      BRAIMSEC_SCAN_ROOT: ${HOST_DATA_DIR:-/data/braimsec}/scans
      PORT: 8000
    volumes:
      - ${HOST_DATA_DIR:-/data/braimsec}:${HOST_DATA_DIR:-/data/braimsec}
    expose:
      - "8000"
    # Loopback only: lets deploy.sh smoke-test the API directly while
    # public traffic goes through Caddy (ports 80/443).
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app/api
    environment:
      BRAIMSEC_BROKER_URL: redis://redis:6379/0
      BRAIMSEC_DB: ${HOST_DATA_DIR:-/data/braimsec}/braimsec.db
      BRAIMSEC_SCAN_ROOT: ${HOST_DATA_DIR:-/data/braimsec}/scans
      # Sandboxed engines: semgrep+gitleaks run in throwaway containers.
      BRAIMSEC_SCAN_SANDBOX: ${BRAIMSEC_SCAN_SANDBOX:-docker}
      BRAIMSEC_SCAN_RUNNER_IMAGE: ${BRAIMSEC_SCAN_RUNNER_IMAGE:-braimsec/scan-runner:1.0}
      # Sandboxed engines run behind the dedicated runner service (narrow
      # scan-only HTTP API). The worker holds NO Docker access at all —
      # no DOCKER_HOST, no socket, no CLI path to a daemon.
      BRAIMSEC_RUNNER_URL: http://runner:8001
      RUNNER_API_KEY: ${RUNNER_API_KEY}
    depends_on:
      - redis
      - runner
    volumes:
      - ${HOST_DATA_DIR:-/data/braimsec}:${HOST_DATA_DIR:-/data/braimsec}
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=2"]

  # Dedicated scan-runner service: the ONLY component allowed to spawn
  # sandbox containers, behind a narrow scan-only HTTP API
  # (POST /v1/scans, Bearer RUNNER_API_KEY). The image, flags, mounts and
  # target containment are server-side constants — the API exposes no way
  # to pick an image, add mounts, enable the network, or exec. Internal
  # compose network only: no published port, no Caddy route.
  runner:
    build:
      context: ..
      dockerfile: deploy/docker/runner.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY}
      HOST_DATA_DIR: ${HOST_DATA_DIR:-/data/braimsec}
      BRAIMSEC_SCAN_RUNNER_IMAGE: ${BRAIMSEC_SCAN_RUNNER_IMAGE:-braimsec/scan-runner:1.0}
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    volumes:
      # Same host path as everywhere else: -v mounts in sandbox
      # containers are resolved by the Docker daemon on the HOST.
      - ${HOST_DATA_DIR:-/data/braimsec}:${HOST_DATA_DIR:-/data/braimsec}

  # Filtered Docker API proxy: the ONLY holder of the host socket.
  # Only the runner service reaches it now (the worker has no Docker
  # access at all). The runner needs container/image API sections for
  # `docker run --rm` + logs; build/swarm/secrets/networks/volumes and
  # the rest stay denied at the proxy. Even if the runner were tricked,
  # its own API cannot express exec, custom images or extra mounts.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      # Method gate: the proxy denies everything except GET unless POST=1.
      # `docker run` needs POST (create/start/attach/wait).
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      # Everything else defaults to 0 (denied): AUTH, BUILD, COMMIT,
      # CONFIGS, DISTRIBUTION, EXEC, INFO, NETWORKS, NODES, PLUGINS,
      # SECRETS, SERVICES, SESSION, SWARM, SYSTEM, TASKS, VOLUMES.
      # NOTE: with POST=1 the generic /containers allow-list also covers
      # the exec endpoint (the image has no separate exec deny) — exec
      # into running containers is possible via the proxy. This plus
      # create-with-arbitrary-mounts means a compromised worker is still
      # not fully contained; the complete fix is a dedicated runner
      # service with a narrow scan-only API (planned before multi-tenant).
    volumes:
      # The proxy is the ONLY holder of the host socket (read-only mount).
      - /var/run/docker.sock:/var/run/docker.sock:ro

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    working_dir: /app/api
    environment:
      BRAIMSEC_BROKER_URL: redis://redis:6379/0
      BRAIMSEC_DB: ${HOST_DATA_DIR:-/data/braimsec}/braimsec.db
      BRAIMSEC_SCAN_ROOT: ${HOST_DATA_DIR:-/data/braimsec}/scans
    volumes:
      - ${HOST_DATA_DIR:-/data/braimsec}:${HOST_DATA_DIR:-/data/braimsec}
    # Fires braimsec.check_schedules every 60s (see beat_schedule in
    # api/tasks.py). The schedule claim is a conditional DB UPDATE, so a
    # second beat instance can never double-run a schedule.
    command: ["celery", "-A", "tasks", "beat", "--loglevel=info",
              "--schedule=/tmp/celerybeat-schedule"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    # The Caddyfile reads {$SITE_ADDRESS} from this container's environment.
    # Without this, the site address would be empty and Caddy refuses to start.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
