# BraimSec GitHub Actions security rules (v1) — first principles.
#
# Why these exist: `--config auto` (open-source registry) does not reliably
# flag CI/CD misconfigurations in .github/workflows/*.yml. These three rules
# cover the highest-signal, deterministic CI/CD risk families:
#
#  1. Script injection — a `run:` step interpolating an attacker-controlled
#     GitHub context (${{ github.event.* }}, head_ref, inputs.*, matrix.*).
#     This is the #1 GitHub Actions vulnerability class: a malicious PR
#     title, branch name, or issue body becomes shell code in a privileged
#     workflow. GitHub's own docs treat these contexts as untrusted input.
#  2. Unpinned third-party actions — `uses: owner/repo@v4` (or @main) lets
#     a compromised tag/branch silently change the code that runs with your
#     secrets. A full 40-char commit SHA is the only tamper-proof pin.
#  3. Overly broad permissions — `permissions: write-all` grants every
#     permission scope to the workflow's GITHUB_TOKEN; a single injected
#     step can then push code, read secrets, or approve PRs.
#
# Design philosophy (precision-first, honest):
# - Script injection fires only on contexts GitHub documents as
#   attacker-controlled. `${{ secrets.* }}`, `${{ github.sha }}` and
#   `${{ github.run_id }}` are deliberately NOT flagged — interpolating
#   them into `run:` is not injection (they are not attacker-controlled).
# - Unpinned-action fires only when a `uses:` reference has a @version part
#   that is not a full SHA. Local actions (`./path`) and Docker actions
#   without @ are untouched. Severity is WARNING: pinning is hygiene, the
#   AI review layer judges real exploitability.
# - Rule IDs are namespaced `braimsec.gha.*`, matching the taint pack's
#   `braimsec.taint.*` convention.
#
# DO NOT tune these against the old holdout set (SPEC v1.0 §4 — no
# holdout contamination).

rules:
  - id: braimsec.gha.script-injection
    languages: [yaml]
    severity: ERROR
    message: >-
      GitHub Actions script injection: this `run:` step interpolates an
      attacker-controlled GitHub context (${{ ... }}). A malicious PR title,
      branch name, issue body, or workflow input can execute arbitrary
      commands with this workflow's permissions. Do not interpolate
      contexts into `run:` scripts — pass the value through an `env:`
      variable instead (env values are not expanded as code).
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
    patterns:
      - pattern: |
          run: $SCRIPT
      - metavariable-regex:
          metavariable: $SCRIPT
          # (?s): the script is usually a multi-line block scalar.
          # NOTE: semgrep's metavariable-regex requires a FULL match of the
          # metavariable content, hence the .* wrappers (it is not a search).
          # Flagged contexts are the ones GitHub documents as
          # attacker-controlled. secrets.*/github.sha/github.run_id are
          # deliberately excluded (not attacker-controlled).
          regex: '(?s).*\$\{\{\s*(github\.event\.|github\.head_ref|github\.base_ref|github\.ref_name|inputs\.|matrix\.).*'

  - id: braimsec.gha.unpinned-action
    languages: [yaml]
    severity: WARNING
    message: >-
      Third-party GitHub Action is not pinned to a commit SHA
      (`uses: owner/action@tag`). Tags and branches are mutable: a
      compromised or re-pointed tag silently changes the code running with
      your secrets. Pin to a full 40-character commit SHA instead.
    metadata:
      category: security
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      impact: MEDIUM
    patterns:
      - pattern: |
          uses: $ACTION
      - metavariable-regex:
          metavariable: $ACTION
          # Has a @version part (skips ./local and docker:// refs) that is
          # NOT a full 40-hex commit SHA. Tags, branches, and short SHAs
          # are all mutable/ambiguous -> flag them.
          regex: '^[^@\s]+@(?!([0-9a-fA-F]{40})$)[^\s]+$'

  - id: braimsec.gha.broad-permissions
    languages: [yaml]
    severity: WARNING
    message: >-
      Workflow grants `permissions: write-all` — every permission scope is
      handed to GITHUB_TOKEN. A single compromised or injected step can
      then push code, read secrets, or modify the repository. Grant only
      the scopes each job needs (e.g. `contents: read`).
    metadata:
      category: security
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: "A01:2021 - Broken Access Control"
      confidence: HIGH
      impact: MEDIUM
    patterns:
      - pattern: |
          permissions: write-all
