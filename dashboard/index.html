<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BraimSec 🛡️ — لوحة تحكم الفحص الأمني</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2330;
    --border: #2d3748;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --red: #f85149;
    --amber: #d29922;
    --blue: #58a6ff;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0d1117 0%, #1a1f35 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  header .logo { font-size: 2rem; }
  header h1 { font-size: 1.4rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.85rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .toolbar h2 { font-size: 1.2rem; }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0d1117; border: none; border-radius: 10px;
    padding: 0.65rem 1.4rem; font-size: 1rem; font-weight: bold;
    cursor: pointer; transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn-ghost {
    background: var(--bg3); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.55rem 1.1rem; font-size: 0.95rem; cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); }
  .scan-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: border-color 0.2s, transform 0.15s;
  }
  .scan-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .scan-card .name { font-weight: bold; font-size: 1.05rem; }
  .scan-card .meta { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }
  .scan-card .left { display: flex; align-items: center; gap: 0.8rem; }
  .badge {
    display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.78rem; font-weight: bold;
  }
  .b-done { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid var(--green); }
  .b-running { background: rgba(88,166,255,.15); color: var(--blue); border: 1px solid var(--blue); }
  .b-queued { background: rgba(139,148,158,.15); color: var(--muted); border: 1px solid var(--muted); }
  .b-failed { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid var(--red); }
  .sev { font-weight: bold; font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 6px; }
  .sev-error { background: rgba(248,81,73,.15); color: var(--red); }
  .sev-warning { background: rgba(210,153,34,.15); color: var(--amber); }
  .sev-note { background: rgba(88,166,255,.15); color: var(--blue); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.1rem; text-align: center;
  }
  .card .num { font-size: 2rem; font-weight: bold; }
  .card .lbl { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .card.c-error .num { color: var(--red); }
  .card.c-warning .num { color: var(--amber); }
  .card.c-note .num { color: var(--blue); }
  .card.c-total .num { color: var(--accent); }
  .filters { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn {
    background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.4rem 1rem; cursor: pointer; font-size: 0.88rem;
  }
  .filter-btn.active { color: #0d1117; background: var(--accent); border-color: var(--accent); font-weight: bold; }
  table { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 14px; overflow: hidden; }
  th, td { padding: 0.8rem 1rem; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: var(--bg3); color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(34,211,238,.04); }
  td code { font-family: Consolas, monospace; font-size: 0.82rem; color: var(--accent2); }
  .msg { color: var(--muted); font-size: 0.85rem; max-width: 380px; }
  .empty { text-align: center; color: var(--muted); padding: 3rem; background: var(--bg2); border-radius: 14px; border: 1px dashed var(--border); }
  .empty .big { font-size: 3rem; margin-bottom: 0.5rem; }
  .modal-back {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
    padding: 2rem; width: 90%; max-width: 480px;
  }
  .modal h3 { margin-bottom: 1.2rem; }
  .modal label { display: block; color: var(--muted); font-size: 0.88rem; margin: 1rem 0 0.4rem; }
  .modal input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 0.65rem 0.9rem; font-size: 0.95rem;
  }
  .modal input[type=file] { margin-top: 0.3rem; color: var(--muted); font-size: 0.88rem; }
  .modal .row { display: flex; gap: 0.8rem; margin-top: 1.6rem; justify-content: flex-start; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--blue); border-top-color: transparent;
    animation: spin 0.8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .detail-head h2 { font-size: 1.25rem; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem; }
  @media (max-width: 640px) {
    .scan-card { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
    th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🛡️</div>
  <div>
    <h1>Braim<span>Sec</span></h1>
    <p>منصة فحص الثغرات الأمنية للمؤسسات</p>
  </div>
  <div style="margin-inline-start: auto; display: flex; align-items: center; gap: 0.5rem;">
    <input id="api-key" type="password" placeholder="API key"
      style="background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.7rem; font-size: 0.85rem; width: 11rem;"
      oninput="localStorage.setItem('braimsec_key', this.value)">
    <script>document.getElementById('api-key').value = localStorage.getItem('braimsec_key') || '';</script>
  </div>
</header>

<main>
  <!-- قائمة الفحوصات -->
  <section id="view-scans">
    <div class="toolbar">
      <h2>📋 عمليات الفحص</h2>
      <button class="btn" onclick="openModal()">+ فحص جديد</button>
    </div>
    <div id="scans-list"></div>
  </section>

  <!-- تفاصيل الفحص -->
  <section id="view-detail" hidden>
    <div class="detail-head">
      <h2 id="detail-title"></h2>
      <button class="btn-ghost" onclick="showScans()">→ رجوع للقائمة</button>
    </div>
    <div id="detail-status"></div>
    <div class="cards" id="severity-cards"></div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-sev="" onclick="setFilter('')">الكل</button>
      <button class="filter-btn" data-sev="error" onclick="setFilter('error')">🔴 حرجة</button>
      <button class="filter-btn" data-sev="warning" onclick="setFilter('warning')">🟡 متوسطة</button>
      <button class="filter-btn" data-sev="note" onclick="setFilter('note')">🔵 منخفضة</button>
    </div>
    <div id="findings-wrap"></div>
  </section>
</main>

<!-- نافذة فحص جديد -->
<div id="modal-back" class="modal-back" hidden>
  <div class="modal">
    <h3>🚀 بدء فحص جديد</h3>
    <label>مسار مجلد الكود (على السيرفر)</label>
    <input type="text" id="target-path" placeholder="/path/to/code" dir="ltr">
    <label>أو ارفع ملف مضغوط (zip)</label>
    <input type="file" id="zip-file" accept=".zip">
    <div class="row">
      <button class="btn" onclick="startScan()">ابدأ الفحص</button>
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
    <p id="modal-err" style="color: var(--red); font-size: 0.85rem; margin-top: 0.8rem;"></p>
  </div>
</div>

<footer>BraimSec v0.1.0 — نموذج أولي</footer>

<script>
const API = "/api";
let currentScan = null, currentFilter = "", pollTimer = null;

const SEV_AR = { error: "حرجة", warning: "متوسطة", note: "منخفضة" };
const STATUS_AR = { queued: "في الانتظار", running: "جارٍ الفحص", done: "مكتمل", failed: "فشل" };

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {
    "X-API-Key": localStorage.getItem("braimsec_key") || ""
  });
  const r = await fetch(API + path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadScans() {
  const scans = await api("/scans");
  const el = document.getElementById("scans-list");
  if (!scans.length) {
    el.innerHTML = `<div class="empty"><div class="big">🔍</div><p>لا توجد فحوصات بعد — ابدأ أول فحص لك!</p></div>`;
    return;
  }
  el.innerHTML = scans.map(s => `
    <div class="scan-card" onclick="openDetail('${s.id}')">
      <div>
        <div class="name">📁 ${esc(s.target_name)}</div>
        <div class="meta">${esc(s.created_at.slice(0,16).replace("T"," "))} — ${s.total_findings} نتيجة</div>
      </div>
      <div class="left">
        <span class="badge b-${s.status}">${s.status === "running" ? '<span class="spinner"></span> ' : ""}${STATUS_AR[s.status] || s.status}</span>
      </div>
    </div>`).join("");
}

async function openDetail(id) {
  currentScan = id; currentFilter = "";
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.sev === ""));
  document.getElementById("view-scans").hidden = true;
  document.getElementById("view-detail").hidden = false;
  await refreshDetail();
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const s = await api(`/scans/${id}`);
    if (s.status === "done" || s.status === "failed") { clearInterval(pollTimer); await refreshDetail(); }
    else { document.getElementById("detail-status").innerHTML = statusLine(s); }
  }, 3000);
}

function statusLine(s) {
  const spin = (s.status === "running" || s.status === "queued") ? '<span class="spinner"></span> ' : "";
  return `<p style="color:var(--muted);margin:0.4rem 0">${spin}<span class="badge b-${s.status}">${STATUS_AR[s.status]}</span>
    ${s.error ? ` — <span style="color:var(--red)">${esc(s.error)}</span>` : ""}</p>`;
}

async function refreshDetail() {
  const s = await api(`/scans/${currentScan}`);
  document.getElementById("detail-title").textContent = "📁 " + s.target_name;
  document.getElementById("detail-status").innerHTML = statusLine(s);
  const sum = s.severity_summary || {};
  const total = s.total_findings || 0;
  document.getElementById("severity-cards").innerHTML = `
    <div class="card c-total"><div class="num">${total}</div><div class="lbl">إجمالي النتائج</div></div>
    <div class="card c-error"><div class="num">${sum.error || 0}</div><div class="lbl">🔴 حرجة</div></div>
    <div class="card c-warning"><div class="num">${sum.warning || 0}</div><div class="lbl">🟡 متوسطة</div></div>
    <div class="card c-note"><div class="num">${sum.note || 0}</div><div class="lbl">🔵 منخفضة</div></div>`;
  await loadFindings();
}

async function loadFindings() {
  const q = currentFilter ? `?severity=${currentFilter}` : "";
  const rows = await api(`/scans/${currentScan}/results${q}`);
  const el = document.getElementById("findings-wrap");
  if (!rows.length) { el.innerHTML = `<div class="empty"><p>لا توجد نتائج بهذا التصنيف 🎉</p></div>`; return; }
  el.innerHTML = `<table><thead><tr>
      <th>الخطورة</th><th>الأداة / القاعدة</th><th>الموقع</th><th>الوصف</th>
    </tr></thead><tbody>` + rows.map(f => `
    <tr>
      <td><span class="sev sev-${f.severity}">${SEV_AR[f.severity] || f.severity}</span></td>
      <td><code>${esc(f.tool)}/${esc(f.rule_id.split(".").pop())}</code></td>
      <td><code dir="ltr">${esc(f.file.split("/").pop())}:${f.line}</code></td>
      <td class="msg">${esc(f.message.slice(0, 140))}</td>
    </tr>`).join("") + `</tbody></table>`;
}

function setFilter(sev) {
  currentFilter = sev;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.sev === sev));
  loadFindings();
}

function showScans() {
  clearInterval(pollTimer);
  document.getElementById("view-detail").hidden = true;
  document.getElementById("view-scans").hidden = false;
  loadScans();
}

function openModal() { document.getElementById("modal-back").hidden = false; document.getElementById("modal-err").textContent = ""; }
function closeModal() { document.getElementById("modal-back").hidden = true; }

async function startScan() {
  const err = document.getElementById("modal-err");
  err.textContent = "";
  const fd = new FormData();
  const path = document.getElementById("target-path").value.trim();
  const file = document.getElementById("zip-file").files[0];
  if (file) fd.append("file", file);
  else if (path) fd.append("target_path", path);
  else { err.textContent = "حدد مساراً أو ارفع ملف zip"; return; }
  try {
    const r = await api("/scans", { method: "POST", body: fd });
    closeModal();
    document.getElementById("target-path").value = "";
    document.getElementById("zip-file").value = "";
    openDetail(r.scan_id);
  } catch (e) { err.textContent = e.message; }
}

loadScans();
setInterval(() => { if (!document.getElementById("view-scans").hidden) loadScans(); }, 5000);
</script>
</body>
</html>
