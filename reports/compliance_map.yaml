# BraimSec compliance mapping — versioned, conservative.
#
# Policy (proposal §4): map ONLY rule -> standard pairs we are confident
# about. Anything else is "unmapped" — never invent a mapping to make a
# report look more complete.
#
# SOC 2 / ISO 27001 columns are populated only where the control genuinely
# describes the vulnerability class:
# - SOC 2 CC6.1 (logical access security): the finding lets an attacker
#   cross a trust boundary or act with ungranted privilege.
# - SOC 2 CC8.1 (change management): the finding lets unreviewed code enter
#   the build/release path.
# - ISO 27001:2022 A.8.28 (secure coding): injection / input-validation
#   flaws — the control explicitly covers secure coding principles.
# - ISO 27001:2022 A.8.26 (application security requirements): insecure
#   application design decisions (e.g. unrestricted upload).
# - ISO 27001:2022 A.8.20 (network security): network-boundary abuse (SSRF).
# - ISO 27001:2022 A.8.3 (information access restriction): access beyond
#   the intended directory/scope.
# - ISO 27001:2022 A.8.9 (configuration management): insecure CI/CD
#   configuration.
# - ISO 27001:2022 A.5.17 (authentication information): hard-coded secrets.
#
# Matching: a finding matches `rule` when check_id == rule or
# check_id endswith rule (semgrep prefixes local rule ids with the file
# path, e.g. ".../rules.braimsec.taint.ssrf-requests"). A `tool` entry
# matches every finding from that tool.

version: "2.0.0"

changelog:
  - "2.0.0 (2026-10-01): SOC 2 + ISO 27001:2022 columns added for every mapped rule; braimsec.inject.* pack mapped. Conservative anchors only."
  - "1.0.0 (2026-09-30): initial conservative mapping - BraimSec taint rules + gitleaks only. Registry rules intentionally unmapped."

mappings:
  - rule: braimsec.taint.ssrf-requests
    owasp: { code: "A10:2021", title: "Server-Side Request Forgery (SSRF)" }
    cwe: { id: "CWE-918", title: "Server-Side Request Forgery (SSRF)" }
    soc2: { code: "CC6.1", title: "Logical access security" }
    iso: { code: "A.8.20", title: "Networks security" }

  - rule: braimsec.taint.ssrf-urllib
